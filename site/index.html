<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pitchroom</title>
<meta name="description" content="Download Pitchroom for macOS, Windows or Linux.">
<meta name="theme-color" content="#141414">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* the app's own tokens (css/tokens.css), the few this page uses: dark only, as the app is */
:root {
 --bg: oklch(0.165 0 0); --surface: oklch(0.2 0 0); --ink: oklch(0.94 0 0); --ink-strong: oklch(1 0 0); --on-ink: oklch(0.165 0 0);
  --voice-white: oklch(0.87 0 0); --voice-coral: oklch(0.72 0.172 32); --voice-orange: oklch(0.75 0.175 58); --voice-amber: oklch(0.77 0.156 82);
  --voice-green: oklch(0.73 0.197 150); --voice-teal: oklch(0.74 0.124 195); --voice-blue: oklch(0.68 0.166 262); --voice-violet: oklch(0.7 0.174 295); --voice-pink: oklch(0.86 0.08 353);
  --font: Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif; --ease: cubic-bezier(0.16, 1, 0.3, 1);
  color-scheme: dark;
}
@media (color-gamut: p3) { /* as the app has them on a wide-gamut screen */
  :root { --voice-blue: oklch(0.68 0.173 262); --voice-violet: oklch(0.7 0.182 295); --voice-coral: oklch(0.72 0.212 32);
    --voice-orange: oklch(0.75 0.195 58); --voice-amber: oklch(0.77 0.174 82); --voice-green: oklch(0.73 0.266 150); --voice-teal: oklch(0.74 0.162 195); }
}
/* one screen, held still: no scrolling and no rubber-band pull past its edges (a trackpad's, a touch screen's) */
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
body { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); -webkit-font-smoothing: antialiased;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; } /* nothing here worth copying */
a { -webkit-user-drag: none; }
/* the button: the app's own primary one (.btn.primary, in css/base.css): 40 px high, 14 px type, an 18 px icon; round at its ends (a pill: a little more room inside them) */
.get { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 18px 0 14px; border-radius: 999px; background: var(--ink); color: var(--on-ink);
  font: 500 14px/1 var(--font); text-decoration: none; -webkit-tap-highlight-color: transparent;
  transition: transform 0.2s var(--ease), background 0.2s; }
/* hover: at the full white; pressed: a little smaller, a shade darker */
.get:hover { background: var(--ink-strong); }
.get:active { background: oklch(0.82 0 0); transform: scale(0.97); transition-duration: 0.06s; }
.get:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.get svg { width: 18px; height: 18px; }
/* the line at the page's foot, 24 px up as the app's column is in from its sides */
.note { position: fixed; bottom: max(24px, env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100vw - 48px);
  margin: 0; text-align: center; color: rgba(255, 255, 255, 0.55); font: 400 13px/1.45 var(--font); }
/* once the download starts: a tip up at the browser's downloads icon, in the toolbar above the page's top right (how far
   in, set by tipAt(); its arrow 38 px in from its right) */
.tip { position: fixed; top: 14px; right: 58px; padding: 10px 14px; border-radius: 10px; background: var(--ink); color: var(--on-ink);
  font: 500 14px/1.3 var(--font); white-space: nowrap; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.32);
  opacity: 0; pointer-events: none; transition: opacity 0.3s var(--ease); } /* it fades in and out, and stays still */
.tip.on { opacity: 1; pointer-events: auto; }
.tip::before { content: ""; position: absolute; top: -6px; right: 32px; width: 12px; height: 12px; background: inherit; border-radius: 2px; transform: rotate(45deg); }

/* The app's welcome (js/app.js, welcome(), and css/base.css, #welcome): a book (the screen less 20 % each side), its
   right half turned over to the left like a page, one after another, each an accent colour (no name over it, here).
   Here it starts closed, its dark cover alone in the middle, and moves right as it opens (its spine to the
   middle); the last page lands dark, then turns back over behind the right page under it, which (the button on it, there
   under the pages all along, shown as the last one lifts off it) comes back to the middle on its own: a plain page, no book.
   The pages are built by riffle() */
.book { position: fixed; inset: 20%; }
.book .half { position: absolute; top: 0; bottom: 0; width: 50%; }
.book .leaf { position: absolute; top: 0; bottom: 0; left: 50%; width: 50%; transform-origin: 0 50%; transform-style: preserve-3d; }
.book .leaf > .half { left: 0; width: 100%; backface-visibility: hidden; }
.book .leaf > .verso { transform: rotateY(180deg); }
.book .shade { position: absolute; inset: 0; background: #000; opacity: 0; } /* the light going off a page as it stands up */
/* a page's front a pixel past the spine, its soft edge under the one turned over it, so no line down the middle (as the
   app's). Not its back: a back past the spine shows as a strip of its colour on the right while the last page lifts off
   what's under it there; the last page's own back goes past it (riffle()), over the edge of the one it lands on */
.book .leaf > .recto { left: -1px; width: calc(100% + 1px); }
.book > .half:first-child { width: calc(50% + 1px); }
/* the right page's own: the button, on the open book's right half, under every page still to turn (they're above it, 100
   and up), so the last one lifting off is what shows it */
.book .page { position: absolute; top: 0; bottom: 0; left: 50%; right: 0; z-index: 1; display: grid; place-items: center; }
.book:not(.built) .page { visibility: hidden; } /* (till its pages are there over it) */
.note { opacity: 0; transition: opacity 0.6s var(--ease); }
.shown .note { opacity: 1; }
/* a phone, up on end: the book narrower at its sides, taller, so a page still holds the button */
@media (max-aspect-ratio: 3 / 4) { .book { inset: 24% 6%; } }
</style>
</head>
<body>
<div class="book" id="book"><div class="page" id="page">
<a class="get" id="get" href="https://github.com/freaktion-craft/pitchroom-releases/releases/latest">
  <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3v10m0 0-4-4m4 4 4-4M4 16h12"/></svg>
  <span id="getLabel">Download</span>
</a>
</div></div>
<p class="note" id="note">A hobby project for people who want to practice their singing.</p>
<div class="tip" id="tip" role="status"></div>

<script>
const API = "https://api.github.com/repos/freaktion-craft/pitchroom-releases/releases/latest";
const ko = /^ko/i.test(navigator.language);
const NAMES = { mac: "macOS", win: "Windows", linux: "Linux" };
const FILES = { "mac-arm64": /mac-arm64\.dmg$/, "mac-x64": /mac-x64\.dmg$/, win: /win-x64\.exe$/, linux: /linux-.*\.AppImage$/ };

function detectOS() {
  const ua = navigator.userAgent, p = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || "";
  if (/iPhone|iPad|iPod|Android/i.test(ua)) return null;
  if (/Win/i.test(p) || /Windows/i.test(ua)) return "win";
  if (/Mac/i.test(p) || /Macintosh/i.test(ua)) return "mac";
  if (/Linux|X11/i.test(p + ua)) return "linux";
  return null;
}
// Apple silicon or Intel: Chromium says; Safari doesn't, so it's Apple silicon (most Macs now)
async function detectMacArch() {
  try {
    const v = await navigator.userAgentData.getHighEntropyValues(["architecture"]);
    if (v.architecture) return v.architecture === "arm" ? "arm64" : "x64";
  } catch {}
  try {
    const gl = document.createElement("canvas").getContext("webgl");
    const r = gl.getParameter(gl.getExtension("WEBGL_debug_renderer_info").UNMASKED_RENDERER_WEBGL);
    if (/Intel|AMD|Radeon/i.test(r)) return "x64";
  } catch {}
  return "arm64";
}

(async () => {
  if (ko) document.getElementById("note").textContent = "노래 연습을 하고 싶은 사람들을 위한 취미 프로젝트예요.";
  const os = detectOS();
  const label = document.getElementById("getLabel");
  label.textContent = !os ? (ko ? "다운로드" : "Download") : ko ? `${NAMES[os]}용 다운로드` : `Download for ${NAMES[os]}`;
  if (!os) return; // a phone, or unknown: the button stays on the releases page
  const key = os === "mac" ? `mac-${await detectMacArch()}` : os;
  try {
    const r = await fetch(API, { headers: { Accept: "application/vnd.github+json" } });
    if (!r.ok) return;
    const file = (await r.json()).assets.find((a) => FILES[key].test(a.name));
    if (file) document.getElementById("get").href = file.browser_download_url;
  } catch {} // offline or rate-limited: the releases page
})();

// the tip, only when the button downloads the file itself (not when it opens the releases page)
const tip = document.getElementById("tip");
let tipTimer;
// how far in from the page's right edge Chrome's downloads icon is: past the profile and the menu (about 96 px); with
// vertical tabs, the window's own buttons are in that row too (about 268 px). Those are told apart by the frame round
// the page: vertical tabs have no tab strip above it (49 px of frame there, against 85 or more) and one at its side
function tipAt() {
  const frameH = outerHeight - innerHeight, frameW = outerWidth - innerWidth;
  const vertical = !/Mac/i.test(navigator.platform) && frameW >= 40 && frameH < 82; // a Mac's window buttons are at the left
  return vertical ? 268 : 96;
}
document.getElementById("get").addEventListener("click", (e) => {
  if (!/\/releases\/download\//.test(e.currentTarget.href)) return;
  tip.style.right = `${tipAt() - 38}px`;
  tip.textContent = ko ? "다운로드 중이에요. 여기서 열 수 있어요" : "Downloading. Open it from here";
  tip.classList.add("on");
  clearTimeout(tipTimer);
  tipTimer = setTimeout(() => tip.classList.remove("on"), 12000);
});
tip.addEventListener("click", () => tip.classList.remove("on"));

// ---------- the riffle (js/app.js's welcome(), its RIFFLE as the app has it) ----------
// slow off the thumb, then a rush, then slow again (the onsets bunched in the middle by bunch), the pages in the air
// together; a beat (rest), and the last page on its own, slower (last).
const RIFFLE = { start: 450, span: 640, page: 440, bunch: 0.65, jitter: [0, 0.06, -0.04, 0.05, -0.06, 0.03, -0.05, 0.04],
  pageEase: "cubic-bezier(0.38, 0, 0.12, 1)", rest: 200, last: 700, lastEase: "cubic-bezier(0.55, 0, 0.2, 1)",
  shade: 0.32,
  open: 520, openEase: "cubic-bezier(0.45, 0, 0.2, 1)", close: 640, closeEase: "cubic-bezier(0.65, 0, 0.25, 1)", // open: the closed book over to the right as its cover starts to lift; close: the right page back to the middle at the end
  back: 620, backEase: "cubic-bezier(0.45, 0, 0.2, 1)" }; // back: the last page turned back over, behind the right one
const CLOSED = "translateX(-25%)"; // the book with its right half (its cover, then its right page) in the middle
const ACCENTS = ["white", "coral", "orange", "amber", "green", "teal", "blue", "violet", "pink"]; // as the app has them (js/stage.js)
async function riffle() {
  const R = RIFFLE, book = document.getElementById("book");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches; // the plain page at once
  // the dark cover, the colours, then the dark last page
  const colours = ["var(--surface)", ...ACCENTS.map((k) => `var(--voice-${k})`), "var(--surface)"], n = colours.length - 1;
  book.style.transform = CLOSED;
 const half = (i, cls, left) => {
    const h = document.createElement("div"); h.className = "half " + cls; h.style.background = colours[i];
    if (left != null) h.style.left = left;
    h.append(Object.assign(document.createElement("i"), { className: "shade" }));
    return h;
  };
  const inside = half(0, "", "0"); inside.style.background = "transparent"; // nothing to the cover's left till it's turned
  book.replaceChildren(inside, half(n, "", "50%"), document.getElementById("page")); // the right page's button on it, under the pages
  if (!still) book.animate([{ transform: CLOSED }, { transform: "none" }], { delay: R.start - R.open / 2, duration: R.open, easing: R.openEase, fill: "both" }); // over to the right as the cover lifts
  const depth = `perspective(${Math.round(book.clientWidth * 2)}px)`; // a page's depth as it turns, for its size
  const turn = (k, delay, duration, easing) => { // page k: colour k on its front (the right), k + 1 on its back
    const leaf = document.createElement("div"); leaf.className = "leaf"; leaf.style.zIndex = 100 - k; leaf.dataset.k = k;
    const front = half(k, "recto"), back = half(k + 1, "verso");
    leaf.append(front, back); book.append(leaf);
    const o = { duration, delay, easing, fill: "both" };
    leaf.animate([{ transform: `${depth} rotateY(0deg)`, zIndex: 100 - k }, { transform: `${depth} rotateY(-90deg)`, zIndex: 100 - k, offset: 0.5 },
      { transform: `${depth} rotateY(-90deg)`, zIndex: 200 + k, offset: 0.5 }, { transform: `${depth} rotateY(-180deg)`, zIndex: 200 + k }], o); // over the spine, it lies on those turned before it
    // which face shows, by the turn itself: the front till it's on edge, the back after (backface-visibility alone let
    // the back show through for a frame now and then, the book moving under it)
    front.animate([{ opacity: 1 }, { opacity: 1, offset: 0.5 }, { opacity: 0, offset: 0.5 }, { opacity: 0 }], o);
    back.animate([{ opacity: 0 }, { opacity: 0, offset: 0.5 }, { opacity: 1, offset: 0.5 }, { opacity: 1 }], o);
    front.lastChild.animate([{ opacity: 0 }, { opacity: R.shade, offset: 0.5 }, { opacity: R.shade }], o);
    return back.lastChild.animate([{ opacity: R.shade }, { opacity: R.shade, offset: 0.5 }, { opacity: 0 }], o).finished.then(() => {
      // once it's down, those down under it go: all their edges at the spine, a soft one over them let theirs show as a
      // line. Only those down (a page can land before one turned ahead of it, still in the air) and under the top one
      leaf.dataset.down = "1"; book.firstChild.style.visibility = "hidden";
      const down = [...book.querySelectorAll(".leaf[data-down]")], top = Math.max(...down.map((l) => +l.dataset.k));
      down.forEach((l) => { if (+l.dataset.k < top) l.style.visibility = "hidden"; });
    });
  };
  const onset = (k) => { const x = k / (n - 2); return R.start + R.span * (x + R.bunch * Math.sin(2 * Math.PI * x) / (2 * Math.PI)); };
  if (!still) for (let k = 0; k < n - 1; k++) turn(k, onset(k), Math.round(R.page * (1 + R.jitter[k % R.jitter.length])), R.pageEase);
  const lastAt = still ? 0 : onset(n - 2) + R.page / 2 + R.rest, landed = turn(n - 1, lastAt, still ? 1 : R.last, R.lastEase);
  book.classList.add("built"); // every page over the button now
 // the last page's back 2 px past the spine (a verso's box is its spine side's left): as it lands, over the edge of the
  // one under it, which would show through its own soft one; past the spine only the dark of the open book's right
  Object.assign(book.lastChild.querySelector(".verso").style, { left: "-2px", width: "calc(100% + 2px)" });
  await landed;
  const leaves = [...book.querySelectorAll(".leaf")], left = leaves.pop();
  leaves.forEach((p) => p.remove()); // the last page over the left, the dark right page under it
  document.body.classList.add("shown"); // the line at the foot
  // the book away: the last page turned on over to the right, behind the right page (under it: -1, under the book's own),
  // so it goes in under it; the right one (the button on it) back to the middle as it does, a plain page
  left.getAnimations({ subtree: true }).forEach((a) => a.cancel());
  const [recto, verso] = left.children, b = { duration: still ? 1 : R.back, easing: R.backEase, fill: "forwards" };
  Object.assign(recto.style, { left: "0", width: "100%" }); // its front no longer a pixel past the spine: under the right page, that pixel showed at its edge
  // on round the same way, through the back of the book (away from you, smaller in its depth, so none of it shows round
  // the right page), to lie flat under it
  left.animate([{ transform: `${depth} rotateY(-180deg)`, zIndex: -1 }, { transform: `${depth} rotateY(-360deg)`, zIndex: -1 }], b)
    .finished.then(() => left.remove()); // gone once it's under: lying there just its size, its edges showed round the page
  verso.animate([{ opacity: 1 }, { opacity: 1, offset: 0.5 }, { opacity: 0, offset: 0.5 }, { opacity: 0 }], b);
  recto.animate([{ opacity: 0 }, { opacity: 0, offset: 0.5 }, { opacity: 1, offset: 0.5 }, { opacity: 1 }], b);
  verso.lastChild.animate([{ opacity: 0 }, { opacity: R.shade, offset: 0.5 }, { opacity: R.shade }], b); // darker as it stands up
  book.animate([{ transform: still ? CLOSED : "none" }, { transform: CLOSED }],
    { delay: still ? 0 : R.back * 0.3, duration: still ? 1 : R.close, easing: R.closeEase, fill: "forwards" });}
riffle();
</script>
</body>
</html>
