<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pitchroom</title>
<meta name="description" content="Download Pitchroom for macOS, Windows or Linux.">
<meta name="theme-color" content="#141414">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* the app's own tokens (css/tokens.css), the few this page uses: dark only, as the app is */
:root {
  --bg: oklch(0.165 0 0); --ink: oklch(0.94 0 0); --ink-strong: oklch(1 0 0); --on-ink: oklch(0.165 0 0);
  --font: Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif; --ease: cubic-bezier(0.16, 1, 0.3, 1);
  color-scheme: dark;
}
/* one screen, held still: no scrolling and no rubber-band pull past its edges (a trackpad's, a touch screen's) */
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
body { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); -webkit-font-smoothing: antialiased;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; } /* nothing here worth copying */
a { -webkit-user-drag: none; }
/* the button: the app's own primary one (.btn.primary, in css/base.css): 40 px high, 14 px type, an 18 px icon; round at its ends (a pill: a little more room inside them) */
.get { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 18px 0 14px; border-radius: 999px; background: var(--ink); color: var(--on-ink);
  font: 500 14px/1 var(--font); text-decoration: none; -webkit-tap-highlight-color: transparent;
  transition: transform 0.2s var(--ease), background 0.2s; }
/* hover: at the full white; pressed: a little smaller, a shade darker */
.get:hover { background: var(--ink-strong); }
.get:active { background: oklch(0.82 0 0); transform: scale(0.97); transition-duration: 0.06s; }
.get:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.get svg { width: 18px; height: 18px; flex: none; }
/* the system's own logo in place of the arrow (logo()), each sized to look as heavy as the others: the Windows panes a
   solid block, smaller; the apple about as much ink, a little taller; Tux, open and fine, the largest */
.get[data-os] { gap: 8px; padding-left: 16px; }
.get[data-os="win"] svg { width: 13px; height: 13px; shape-rendering: crispEdges; } /* (its panes' edges on the pixel grid, wherever the button lands) */
/* and each set on the text by its body, not its box: the apple up a pixel (its leaf above it), Tux down (his head small,
   his weight low: by his box he looked high) */
.get[data-os="mac"] svg { width: 15px; height: 19px; transform: translateY(-1px); }
.get[data-os="linux"] svg { width: 17px; height: 20px; transform: translateY(1.5px); }
/* the line at the page's foot, 24 px up as the app's column is in from its sides */
.note { position: fixed; bottom: max(24px, env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100vw - 48px);
  margin: 0; text-align: center; color: rgba(255, 255, 255, 0.55); font: 400 13px/1.45 var(--font); }
/* once the download starts: a tip up at the browser's downloads icon, in the toolbar above the page's top right (how far
   in, set by tipAt(); its arrow 38 px in from its right) */
.tip { position: fixed; top: 14px; right: 58px; padding: 10px 14px; border-radius: 10px; background: var(--ink); color: var(--on-ink);
  font: 500 14px/1.3 var(--font); white-space: nowrap; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.32);
  opacity: 0; pointer-events: none; transition: opacity 0.3s var(--ease); } /* it fades in and out, and stays still */
.tip.on { opacity: 1; pointer-events: auto; }
.tip::before { content: ""; position: absolute; top: -6px; right: 32px; width: 12px; height: 12px; background: inherit; border-radius: 2px; transform: rotate(45deg); }
/* the name, as the app's welcome has it (Geist Serif, 44 px), where the button was, once it's gone up to the download */
@font-face { font-family: "Geist Serif"; src: url("https://cdn.jsdelivr.net/npm/geist@1.9.0/dist/fonts/geist-serif/GeistSerif-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
.get, .word { grid-area: 1 / 1; } /* one over the other, in the middle */
.word { color: var(--ink); font: 400 44px/1 "Geist Serif", var(--font); letter-spacing: -0.01em; visibility: hidden; }
/* coming in, wiped on from the left: a mask, ink to clear across a soft band, drawn over it from left to right (its band
   off to the left of the name at the start, past its right at the end), the blur going as it does */
.word.in { visibility: visible; -webkit-mask-image: linear-gradient(90deg, #000 40%, transparent 60%); mask-image: linear-gradient(90deg, #000 40%, transparent 60%);
  -webkit-mask-size: 250% 100%; mask-size: 250% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
  animation: wipe 1s cubic-bezier(0.4, 0, 0.2, 1) both, unblur 1s cubic-bezier(0.2, 0, 0, 1) both; }
@keyframes wipe { from { -webkit-mask-position: 100% 0; mask-position: 100% 0; } to { -webkit-mask-position: 0 0; mask-position: 0 0; } }
@keyframes unblur { from { filter: blur(10px); } }
/* as the page comes in: the button up out of a blur, the line at the foot fading in a little after */
@keyframes reveal { from { opacity: 0; filter: blur(12px); } }
@keyframes rise { from { opacity: 0; } }
.get { animation: reveal 0.7s cubic-bezier(0.2, 0, 0, 1) 0.15s both; }
.note { animation: rise 0.6s var(--ease) 0.45s both; }
@media (prefers-reduced-motion: reduce) { .get, .note { animation: none; } }
</style>
</head>
<body>
<a class="get" id="get" href="https://github.com/freaktion-craft/pitchroom-releases/releases/latest">
  <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3v10m0 0-4-4m4 4 4-4M4 16h12"/></svg>
  <span id="getLabel">Download</span>
</a>
<span class="word" id="word" aria-hidden="true">Pitchroom</span>
<p class="note" id="note">A hobby project for people who want to practice their singing.</p>
<div class="tip" id="tip" role="status"></div>

<script>
const API = "https://api.github.com/repos/freaktion-craft/pitchroom-releases/releases/latest";
const ko = /^ko/i.test(navigator.language);
const NAMES = { mac: "macOS", win: "Windows", linux: "Linux" };
const FILES = { "mac-arm64": /mac-arm64\.dmg$/, "mac-x64": /mac-x64\.dmg$/, win: /(pitchroom_install|win-x64)\.exe$/, linux: /linux-.*\.AppImage$/ }; // (Windows': pitchroom_install.exe from 1.0.5, -win-x64.exe before)

// the systems' logos, the apple and Tux from Font Awesome Free 6.5.2 (icons CC BY 4.0, https://fontawesome.com/license/free), Windows' drawn here: the button's
// arrow swapped for the one it downloads for (a phone, or a system it doesn't know, keeps the arrow)
const LOGOS = {
  mac: ["0 0 384 512", "M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"],
  win: ["0 0 13 13", "M0 0h6v6H0zM7 0h6v6H7zM0 7h6v6H0zM7 7h6v6H7z"], // (Windows' own four panes, square, on whole pixels: its slanted old one in Font Awesome came out soft at this size)
  linux: ["0 0 448 512", "M220.8 123.3c1 .5 1.8 1.7 3 1.7 1.1 0 2.8-.4 2.9-1.5.2-1.4-1.9-2.3-3.2-2.9-1.7-.7-3.9-1-5.5-.1-.4.2-.8.7-.6 1.1.3 1.3 2.3 1.1 3.4 1.7zm-21.9 1.7c1.2 0 2-1.2 3-1.7 1.1-.6 3.1-.4 3.5-1.6.2-.4-.2-.9-.6-1.1-1.6-.9-3.8-.6-5.5.1-1.3.6-3.4 1.5-3.2 2.9.1 1 1.8 1.5 2.8 1.4zM420 403.8c-3.6-4-5.3-11.6-7.2-19.7-1.8-8.1-3.9-16.8-10.5-22.4-1.3-1.1-2.6-2.1-4-2.9-1.3-.8-2.7-1.5-4.1-2 9.2-27.3 5.6-54.5-3.7-79.1-11.4-30.1-31.3-56.4-46.5-74.4-17.1-21.5-33.7-41.9-33.4-72C311.1 85.4 315.7.1 234.8 0 132.4-.2 158 103.4 156.9 135.2c-1.7 23.4-6.4 41.8-22.5 64.7-18.9 22.5-45.5 58.8-58.1 96.7-6 17.9-8.8 36.1-6.2 53.3-6.5 5.8-11.4 14.7-16.6 20.2-4.2 4.3-10.3 5.9-17 8.3s-14 6-18.5 14.5c-2.1 3.9-2.8 8.1-2.8 12.4 0 3.9.6 7.9 1.2 11.8 1.2 8.1 2.5 15.7.8 20.8-5.2 14.4-5.9 24.4-2.2 31.7 3.8 7.3 11.4 10.5 20.1 12.3 17.3 3.6 40.8 2.7 59.3 12.5 19.8 10.4 39.9 14.1 55.9 10.4 11.6-2.6 21.1-9.6 25.9-20.2 12.5-.1 26.3-5.4 48.3-6.6 14.9-1.2 33.6 5.3 55.1 4.1.6 2.3 1.4 4.6 2.5 6.7v.1c8.3 16.7 23.8 24.3 40.3 23 16.6-1.3 34.1-11 48.3-27.9 13.6-16.4 36-23.2 50.9-32.2 7.4-4.5 13.4-10.1 13.9-18.3.4-8.2-4.4-17.3-15.5-29.7zM223.7 87.3c9.8-22.2 34.2-21.8 44-.4 6.5 14.2 3.6 30.9-4.3 40.4-1.6-.8-5.9-2.6-12.6-4.9 1.1-1.2 3.1-2.7 3.9-4.6 4.8-11.8-.2-27-9.1-27.3-7.3-.5-13.9 10.8-11.8 23-4.1-2-9.4-3.5-13-4.4-1-6.9-.3-14.6 2.9-21.8zM183 75.8c10.1 0 20.8 14.2 19.1 33.5-3.5 1-7.1 2.5-10.2 4.6 1.2-8.9-3.3-20.1-9.6-19.6-8.4.7-9.8 21.2-1.8 28.1 1 .8 1.9-.2-5.9 5.5-15.6-14.6-10.5-52.1 8.4-52.1zm-13.6 60.7c6.2-4.6 13.6-10 14.1-10.5 4.7-4.4 13.5-14.2 27.9-14.2 7.1 0 15.6 2.3 25.9 8.9 6.3 4.1 11.3 4.4 22.6 9.3 8.4 3.5 13.7 9.7 10.5 18.2-2.6 7.1-11 14.4-22.7 18.1-11.1 3.6-19.8 16-38.2 14.9-3.9-.2-7-1-9.6-2.1-8-3.5-12.2-10.4-20-15-8.6-4.8-13.2-10.4-14.7-15.3-1.4-4.9 0-9 4.2-12.3zm3.3 334c-2.7 35.1-43.9 34.4-75.3 18-29.9-15.8-68.6-6.5-76.5-21.9-2.4-4.7-2.4-12.7 2.6-26.4v-.2c2.4-7.6.6-16-.6-23.9-1.2-7.8-1.8-15 .9-20 3.5-6.7 8.5-9.1 14.8-11.3 10.3-3.7 11.8-3.4 19.6-9.9 5.5-5.7 9.5-12.9 14.3-18 5.1-5.5 10-8.1 17.7-6.9 8.1 1.2 15.1 6.8 21.9 16l19.6 35.6c9.5 19.9 43.1 48.4 41 68.9zm-1.4-25.9c-4.1-6.6-9.6-13.6-14.4-19.6 7.1 0 14.2-2.2 16.7-8.9 2.3-6.2 0-14.9-7.4-24.9-13.5-18.2-38.3-32.5-38.3-32.5-13.5-8.4-21.1-18.7-24.6-29.9s-3-23.3-.3-35.2c5.2-22.9 18.6-45.2 27.2-59.2 2.3-1.7.8 3.2-8.7 20.8-8.5 16.1-24.4 53.3-2.6 82.4.6-20.7 5.5-41.8 13.8-61.5 12-27.4 37.3-74.9 39.3-112.7 1.1.8 4.6 3.2 6.2 4.1 4.6 2.7 8.1 6.7 12.6 10.3 12.4 10 28.5 9.2 42.4 1.2 6.2-3.5 11.2-7.5 15.9-9 9.9-3.1 17.8-8.6 22.3-15 7.7 30.4 25.7 74.3 37.2 95.7 6.1 11.4 18.3 35.5 23.6 64.6 3.3-.1 7 .4 10.9 1.4 13.8-35.7-11.7-74.2-23.3-84.9-4.7-4.6-4.9-6.6-2.6-6.5 12.6 11.2 29.2 33.7 35.2 59 2.8 11.6 3.3 23.7.4 35.7 16.4 6.8 35.9 17.9 30.7 34.8-2.2-.1-3.2 0-4.2 0 3.2-10.1-3.9-17.6-22.8-26.1-19.6-8.6-36-8.6-38.3 12.5-12.1 4.2-18.3 14.7-21.4 27.3-2.8 11.2-3.6 24.7-4.4 39.9-.5 7.7-3.6 18-6.8 29-32.1 22.9-76.7 32.9-114.3 7.2zm257.4-11.5c-.9 16.8-41.2 19.9-63.2 46.5-13.2 15.7-29.4 24.4-43.6 25.5s-26.5-4.8-33.7-19.3c-4.7-11.1-2.4-23.1 1.1-36.3 3.7-14.2 9.2-28.8 9.9-40.6.8-15.2 1.7-28.5 4.2-38.7 2.6-10.3 6.6-17.2 13.7-21.1.3-.2.7-.3 1-.5.8 13.2 7.3 26.6 18.8 29.5 12.6 3.3 30.7-7.5 38.4-16.3 9-.3 15.7-.9 22.6 5.1 9.9 8.5 7.1 30.3 17.1 41.6 10.6 11.6 14 19.5 13.7 24.6zM173.3 148.7c2 1.9 4.7 4.5 8 7.1 6.6 5.2 15.8 10.6 27.3 10.6 11.6 0 22.5-5.9 31.8-10.8 4.9-2.6 10.9-7 14.8-10.4s5.9-6.3 3.1-6.6-2.6 2.6-6 5.1c-4.4 3.2-9.7 7.4-13.9 9.8-7.4 4.2-19.5 10.2-29.9 10.2s-18.7-4.8-24.9-9.7c-3.1-2.5-5.7-5-7.7-6.9-1.5-1.4-1.9-4.6-4.3-4.9-1.4-.1-1.8 3.7 1.7 6.5z"],
};
function logo(os) {
  const [box, d] = LOGOS[os], svg = document.querySelector("#get svg");
  svg.setAttribute("viewBox", box); svg.setAttribute("fill", "currentColor"); svg.setAttribute("stroke", "none");
  svg.innerHTML = `<path d="${d}"/>`;
  document.getElementById("get").dataset.os = os;
}
function detectOS() {
  const ua = navigator.userAgent, p = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || "";
  if (/iPhone|iPad|iPod|Android/i.test(ua)) return null;
  if (/Win/i.test(p) || /Windows/i.test(ua)) return "win";
  if (/Mac/i.test(p) || /Macintosh/i.test(ua)) return "mac";
  if (/Linux|X11/i.test(p + ua)) return "linux";
  return null;
}
// Apple silicon or Intel: Chromium says; Safari doesn't, so it's Apple silicon (most Macs now)
async function detectMacArch() {
  try {
    const v = await navigator.userAgentData.getHighEntropyValues(["architecture"]);
    if (v.architecture) return v.architecture === "arm" ? "arm64" : "x64";
  } catch {}
  try {
    const gl = document.createElement("canvas").getContext("webgl");
    const r = gl.getParameter(gl.getExtension("WEBGL_debug_renderer_info").UNMASKED_RENDERER_WEBGL);
    if (/Intel|AMD|Radeon/i.test(r)) return "x64";
  } catch {}
  return "arm64";
}

(async () => {
  if (ko) document.getElementById("note").textContent = "노래 연습을 하고 싶은 사람들을 위한 취미 프로젝트예요.";
  const os = detectOS();
  const label = document.getElementById("getLabel");
  label.textContent = !os ? (ko ? "다운로드" : "Download") : ko ? `${NAMES[os]}용 다운로드` : `Download for ${NAMES[os]}`;
  if (os) logo(os);
  if (!os) return; // a phone, or unknown: the button stays on the releases page
  const key = os === "mac" ? `mac-${await detectMacArch()}` : os;
  try {
    const r = await fetch(API, { headers: { Accept: "application/vnd.github+json" } });
    if (!r.ok) return;
    const file = (await r.json()).assets.find((a) => FILES[key].test(a.name));
    if (file) document.getElementById("get").href = file.browser_download_url;
  } catch {} // offline or rate-limited: the releases page
})();

// the tip, only when the button downloads the file itself (not when it opens the releases page)
const tip = document.getElementById("tip");
let tipTimer;
// how far in from the page's right edge Chrome's downloads icon is: past the profile and the menu (about 96 px); with
// vertical tabs, the window's own buttons are in that row too (about 268 px). Those are told apart by the frame round
// the page: vertical tabs have no tab strip above it (49 px of frame there, against 85 or more) and one at its side
function tipAt() {
  const frameH = outerHeight - innerHeight, frameW = outerWidth - innerWidth;
  const vertical = !/Mac/i.test(navigator.platform) && frameW >= 40 && frameH < 82; // a Mac's window buttons are at the left
  return vertical ? 268 : 96;
}
const showTip = () => {
  tip.textContent = ko ? "다운로드 중이에요. 여기서 열 수 있어요" : "Downloading. Open it from here";
  tip.classList.add("on");
  clearTimeout(tipTimer);
  tipTimer = setTimeout(() => tip.classList.remove("on"), 12000);
};
// the button gone up to where the download is: its words going as it draws in round its logo, a circle, then off up to
// the browser's downloads icon (where the tip points), smaller, into the toolbar; the tip as it gets there, and in the
// button's place the name, out of a blur. A copy flies (the button itself, its link and its download, as they are)
const FLY = { shrink: 280, fly: 760, size: 40, bend: [0.05, 1] }; // bend: the arc's control point, its share of the way across and up
document.fonts.load('400 44px "Geist Serif"').catch(() => {}); // the name's typeface in ahead of a click
let flying = false;
async function fly(get) {
  const r = get.getBoundingClientRect(), s = get.querySelector("svg").getBoundingClientRect(), t = get.querySelector("span").getBoundingClientRect(), D = FLY.size;
  const ghost = get.cloneNode(true); ghost.removeAttribute("id"); ghost.removeAttribute("href"); ghost.setAttribute("aria-hidden", "true");
  Object.assign(ghost.style, { position: "fixed", left: `${r.left}px`, top: `${r.top}px`, width: `${r.width}px`, height: `${r.height}px`,
    padding: "0", margin: "0", animation: "none", pointerEvents: "none", zIndex: 2000, overflow: "hidden" });
  const [svg, label] = [ghost.querySelector("svg"), ghost.querySelector("span")];
  // each where it is on the button now (its logo's nudge onto the text already in where it's measured)
  Object.assign(svg.style, { position: "absolute", left: `${s.left - r.left}px`, top: `${s.top - r.top}px`, transform: "none" });
  Object.assign(label.style, { position: "absolute", left: `${t.left - r.left}px`, top: `${t.top - r.top}px`, whiteSpace: "nowrap" });
  document.body.append(ghost);
  get.style.visibility = "hidden";
  const shrink = { duration: FLY.shrink, easing: "cubic-bezier(0.4, 0, 0.2, 1)", fill: "forwards" };
  label.animate([{ opacity: 1 }, { opacity: 0 }], { ...shrink, duration: FLY.shrink * 0.6 });
  svg.animate([{ left: `${s.left - r.left}px` }, { left: `${(D - s.width) / 2}px` }], shrink);
  await ghost.animate([{ left: `${r.left}px`, width: `${r.width}px` }, { left: `${r.left + (r.width - D) / 2}px`, width: `${D}px` }], shrink).finished;
  // off up to the downloads icon: its middle to the top edge, under it, getting smaller, gone as it gets there
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2, tx = innerWidth - tipAt(), ty = 0;
  svg.animate([{ opacity: 1 }, { opacity: 0 }], { duration: FLY.fly * 0.4, easing: "ease-out", fill: "forwards" }); // its logo going as it sets off: a plain dot goes up
  // along an arc, as a thing tossed up: rising first, then bending over to the right (a curve through a point above where
  // it starts, its control), not straight across; eased in and out along it, smaller as it goes, gone as it gets there
  const dx = tx - cx, dy = ty - cy - 8, c = { x: dx * FLY.bend[0], y: dy * FLY.bend[1] }, ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2);
  const path = Array.from({ length: 25 }, (_, i) => {
    const t = i / 24, e = ease(t), u = 1 - e, x = 2 * u * e * c.x + e * e * dx, y = 2 * u * e * c.y + e * e * dy; // a quadratic curve from here to there
    return { offset: t, transform: `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) scale(${(1 - 0.8 * e).toFixed(3)})`, opacity: t < 0.85 ? 1 : (1 - t) / 0.15 };
  });
  await ghost.animate(path, { duration: FLY.fly, easing: "linear", fill: "forwards" }).finished;
  ghost.remove();
  showTip();
  // the button gone for good (its download's begun), the name in its place, wiped on from the left out of a blur
  document.getElementById("word").classList.add("in");
}
document.getElementById("get").addEventListener("click", (e) => {
  if (!/\/releases\/download\//.test(e.currentTarget.href)) return;
  tip.style.right = `${tipAt() - 38}px`;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return showTip();
  if (flying) return;
  flying = true;
  fly(e.currentTarget).finally(() => { flying = false; });
});
tip.addEventListener("click", () => tip.classList.remove("on"));
</script>
</body>
</html>
