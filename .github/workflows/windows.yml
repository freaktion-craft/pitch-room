# The Windows installer, built here (this repo is public, so the minutes are free; the builds dropped after 1.0.24 were
# of a private repo and needed paid ones). When a version tag is pushed (vX.Y.Z, desktop/package.json's "version"), the
# installer is built as the owner's PC built it, installed and started on this machine to see that it runs, and left as
# the run's artifact "pitchroom-windows": pitchroom_install.exe, its .blockmap and latest.yml. Nothing is published from
# here and this run holds no token for the releases repo: `npm run release-win` on the owner's computer puts the three
# files into the tag's release (docs/agents/desktop-and-release.md, Releases).
# The Pro icons (icons.local.js, never in the repo) come from the secrets ICONS_LOCAL_1 to 6, put there by
# `npm run icons-secret`; a tag's build stops without them, any other build goes on with the free set.
# Run by hand (Actions → Windows installer → Run workflow) to build a branch without releasing; a pull request that
# changes this file builds too, to try the change.
name: Windows installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/windows.yml"]

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22 # 22.12 or later, which Electron 45 requires
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: The tag is the version in package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::the tag is $GITHUB_REF_NAME, but desktop/package.json says $v"; exit 1; }

      - name: The Pro icons
        shell: bash
        env: # in six parts: a variable on Windows holds 32,767 characters
          I1: ${{ secrets.ICONS_LOCAL_1 }}
          I2: ${{ secrets.ICONS_LOCAL_2 }}
          I3: ${{ secrets.ICONS_LOCAL_3 }}
          I4: ${{ secrets.ICONS_LOCAL_4 }}
          I5: ${{ secrets.ICONS_LOCAL_5 }}
          I6: ${{ secrets.ICONS_LOCAL_6 }}
        run: |
          all="$I1$I2$I3$I4$I5$I6"
          if [ -z "$all" ]; then
            case "$GITHUB_REF" in
              refs/tags/v*) echo "::error::no ICONS_LOCAL secrets: a release would go out with the free icons (npm run icons-secret)"; exit 1 ;;
              *) echo "::warning::no ICONS_LOCAL secrets: built with the free icons"; echo "icons=free" >> "$GITHUB_ENV"; exit 0 ;;
            esac
          fi
          printf '%s' "$all" | base64 -d | gzip -dc > ../icons.local.js
          [ -s ../icons.local.js ] && node --check ../icons.local.js
          echo "icons=Pro" >> "$GITHUB_ENV"

      - run: npm ci
      - name: The app's own Python, with the base packages
        run: node scripts/fetch-python.mjs
      - name: VB-CABLE's pack, for Live's mic
        run: node scripts/fetch-vbcable.mjs
      - name: The code it ships (minified, the Python as bytecode)
        run: node scripts/prepare-code.mjs
      - name: The installer
        run: npx electron-builder --win --publish never

      - name: The three files, and latest.yml is of this installer
        shell: bash
        run: |
          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const version = require("./package.json").version, yml = fs.readFileSync("dist/latest.yml", "utf8"), exe = fs.readFileSync("dist/pitchroom_install.exe");
            const of = (k) => (yml.match(new RegExp("^" + k + ": (.+)$", "m")) || [])[1];
            const sha = crypto.createHash("sha512").update(exe).digest("base64");
            if (!fs.statSync("dist/pitchroom_install.exe.blockmap").size) throw new Error("the blockmap is empty");
            if (of("version") !== version) throw new Error(`latest.yml says ${of("version")}, package.json ${version}`);
            if (of("path") !== "pitchroom_install.exe") throw new Error(`latest.yml names ${of("path")}`);
            if (of("sha512") !== sha) throw new Error("latest.yml has another installer’s sha512");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Pitchroom ${version} for Windows, ${process.env.icons} icons: pitchroom_install.exe, ${(exe.length / 1048576).toFixed(1)} MB\n\nsha512 \`${sha}\`\n`);
          '

      # What a build can get wrong that nothing above sees (1.0.18 couldn't start): the installer run as a user runs it,
      # the app started, and its engine and page asked for. On a machine that never had Pitchroom.
      - name: It installs and starts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = Start-Process -FilePath (Join-Path $PWD "dist\pitchroom_install.exe") -ArgumentList "/S" -PassThru
          if (-not $setup.WaitForExit(300000)) { throw "The installer didn't finish in 5 minutes." }
          $exe = $null
          for ($i = 0; $i -lt 60 -and -not $exe; $i++) { # (the installer can end before its files are all there)
            $exe = Get-ChildItem (Join-Path $env:LOCALAPPDATA "Programs") -Filter Pitchroom.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
            if (-not $exe) { Start-Sleep -Seconds 2 }
          }
          if (-not $exe) { throw "No Pitchroom.exe under $env:LOCALAPPDATA\Programs after the install." }
          Write-Host "Installed: $exe"
          Start-Process -FilePath $exe
          try {
            $port = 0
            for ($i = 0; $i -lt 90 -and -not $port; $i++) { # 3 minutes: its Python's environment is made on the first start
              Start-Sleep -Seconds 2
              foreach ($p in 5278..5297) {
                try { if ((Invoke-RestMethod -Uri "http://127.0.0.1:$p/api/health" -TimeoutSec 2).app -eq "stem") { $port = $p; break } } catch {}
              }
            }
            if (-not $port) { throw "The app's engine didn't answer on 5278 to 5297 within 3 minutes." }
            $page = Invoke-WebRequest -Uri "http://127.0.0.1:$port/" -UseBasicParsing -TimeoutSec 10
            if ($page.StatusCode -ne 200 -or $page.Content -notmatch "<title>") { throw "The page didn't come from port $port." }
            Start-Sleep -Seconds 5
            if (-not (Get-Process -Name Pitchroom -ErrorAction SilentlyContinue)) { throw "The app closed by itself after starting." }
            Write-Host "Started: the engine and the page answer on port $port."
          } catch {
            Get-ChildItem $env:APPDATA -Filter server.log -Recurse -Depth 3 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "--- $($_.FullName)"; Get-Content $_.FullName -Tail 80 }
            throw
          } finally {
            Get-Process -Name Pitchroom, python -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue # (and its engine)
          }

      - uses: actions/upload-artifact@v5
        with:
          name: pitchroom-windows
          path: |
            desktop/dist/pitchroom_install.exe
            desktop/dist/pitchroom_install.exe.blockmap
            desktop/dist/latest.yml
          if-no-files-found: error
          compression-level: 0 # an installer doesn't get smaller
          retention-days: 14
