# A release of the desktop app in one go (Actions → Release → Run workflow, or gh workflow run release.yml -f bump=patch):
# the version in desktop/package.json up a step (patch, minor or major), committed to main as "Desktop x.y.z" and tagged
# vx.y.z; the app built for each system into that tag's draft release in freaktion-craft/pitchroom-releases (desktop.yml,
# as a tag pushed by hand has it); then, once every build's in, that draft published as the latest, so the app's update
# check and the download page (site/) only ever see a whole release. A build failing leaves the draft as it is: run the
# failed jobs again, and the rest follows. One at a time (concurrency).
# The tag's pushed with this run's own token, which sets off no other workflow, so desktop.yml doesn't build it twice.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version goes up"
        type: choice
        options: [patch, minor, major]
        default: patch
      notes:
        description: "What's new, for the release page (optional; it's public)"
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    if: github.ref == 'refs/heads/main' # a release is of main as it is
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The version up a step
        id: bump
        working-directory: desktop
        run: |
          npm version "${{ inputs.bump }}" --no-git-tag-version   # package.json and its lock alike
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"; echo "tag=v$v" >> "$GITHUB_OUTPUT"
      - name: Committed to main, and tagged
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Desktop ${{ steps.bump.outputs.version }}"
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin HEAD:main "${{ steps.bump.outputs.tag }}"

  build:
    needs: version
    uses: ./.github/workflows/desktop.yml
    with:
      ref: ${{ needs.version.outputs.tag }}
      publish: true
    secrets: inherit

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      TAG: ${{ needs.version.outputs.tag }}
      NOTES: ${{ inputs.notes }}
    steps:
      - name: Every system's files in the draft
        run: |
          names=$(gh release view "$TAG" --repo freaktion-craft/pitchroom-releases --json assets --jq '.assets[].name')
          echo "$names"
          for f in latest.yml latest-mac.yml '-mac-arm64.dmg' '-mac-x64.dmg' 'pitchroom_install.exe'; do
            echo "$names" | grep -qF -- "$f" || { echo "::error::$f is missing from the $TAG draft"; exit 1; }
          done
      - name: The draft published, as the latest
        run: |
          if [ -n "$NOTES" ]; then
            gh release edit "$TAG" --repo freaktion-craft/pitchroom-releases --draft=false --latest --notes "$NOTES"
          else
            gh release edit "$TAG" --repo freaktion-craft/pitchroom-releases --draft=false --latest
          fi
          gh release view "$TAG" --repo freaktion-craft/pitchroom-releases --json url,isDraft
