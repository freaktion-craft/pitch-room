<!doctype html>
<!-- The window while the app gets going: an update if there is one (Windows, Linux), then the engine starting. Behind
     the name, the onboarding's flowers in characters (js/onboard.js, obArt): their outlines found in the same mask
     (img/onboard-flowers-mask.png, inline below: a file:// image can't be read back from a canvas), dim, a slow wave along them. -->
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; font-src 'self'; img-src data:; script-src 'unsafe-inline'">
<title>Pitchroom</title>
<style>
  @font-face { font-family: "Geist Serif"; src: url("GeistSerif-Regular.woff2") format("woff2"); }
  html, body { margin: 0; height: 100%; background: #0e0e0e; color: oklch(0.94 0 0); cursor: default; user-select: none; -webkit-app-region: drag; }
  body { position: relative; font: 12px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .veil { position: absolute; inset: 0; background: radial-gradient(ellipse 58% 34% at 50% 45%, rgba(14, 14, 14, 0.92), rgba(14, 14, 14, 0) 100%),
    linear-gradient(to top, rgba(14, 14, 14, 0.95) 0, rgba(14, 14, 14, 0) 70px); }
  .name { position: absolute; inset: 0 0 24px; display: grid; place-items: center; font: 400 28px "Geist Serif", Georgia, serif; letter-spacing: -0.01em; }
  .foot { position: absolute; left: 0; right: 0; bottom: 22px; display: flex; flex-direction: column; align-items: center; }
  .bar { position: relative; width: 168px; height: 2px; border-radius: 1px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
  .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: oklch(0.87 0 0); transition: width 0.2s; }
  .bar.busy .fill { width: 32%; transition: none; animation: slide 1.3s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(320%); } }
  .status { margin-top: 10px; height: 1.4em; color: rgba(255, 255, 255, 0.55); font-variant-numeric: tabular-nums; }
  @media (prefers-reduced-motion: reduce) { .bar.busy .fill { animation: none; width: 100%; opacity: 0.4; } }
</style>

<body>
  <canvas id="art"></canvas>
  <div class="veil"></div>
  <div class="name">Pitchroom</div>
  <div class="foot">
    <div class="bar busy" id="bar"><div class="fill" id="fill"></div></div>
    <div class="status" id="status">Starting…</div>
  </div>
<script>
  // main.js: set({ text, percent }); no percent, the bar just moves
  function set({ text, percent }) {
    document.getElementById("status").textContent = text;
    const bar = document.getElementById("bar"), fill = document.getElementById("fill");
    bar.classList.toggle("busy", percent == null);
    fill.style.width = percent == null ? "" : `${percent}%`;
  }

  // the flowers: | - / \ along their edges, now and then a heavier mark; the leaves fainter, filled from their edge in
  (() => {
    const CELL = 8, SPARK = "@#%&$*+", FILL = "+=-::..", DEPTH = 7, HEAVY = 0.4, LEAF = 0.4, DIM = 0.3;
    const cv = document.getElementById("art"), still = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const mask = new Image();
    mask.onload = () => {
      const W = innerWidth, H = innerHeight, dpr = devicePixelRatio || 1, mw = mask.naturalWidth, mh = mask.naturalHeight;
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
      const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0);
      const t = document.createElement("canvas"); t.width = mw; t.height = mh;
      const tx = t.getContext("2d"); tx.drawImage(mask, 0, 0); const M = tx.getImageData(0, 0, mw, mh).data;
      const s = Math.max(W / mw, H / mh), ox = (W - mw * s) / 2, oy = (H - mh * s) / 2; // as cover
      const cols = Math.ceil(W / CELL), rows = Math.ceil(H / CELL), n = cols * rows, lab = new Uint8Array(n), kind = new Uint8Array(n), deep = new Uint8Array(n);
      for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
        const mx = Math.min(mw - 1, Math.max(0, Math.floor((x * CELL + CELL / 2 - ox) / s)));
        const my = Math.min(mh - 1, Math.max(0, Math.floor((y * CELL + CELL / 2 - oy) / s)));
        const k = (my * mw + mx) * 4; lab[y * cols + x] = M[k] > 128 ? 1 : M[k + 1] > 128 ? 2 : 0;
      }
      const line = new Array(n).fill(""), inside = (X, Y, l) => X >= 0 && Y >= 0 && X < cols && Y < rows && lab[Y * cols + X] === l;
      for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
        const i = y * cols + x, l = lab[i]; if (!l) continue;
        const L = !inside(x - 1, y, l), R = !inside(x + 1, y, l), U = !inside(x, y - 1, l), D = !inside(x, y + 1, l);
        if (!(L || R || U || D)) continue;
        kind[i] = l; line[i] = (U && L) || (D && R) ? "/" : (U && R) || (D && L) ? "\\" : U || D ? "-" : "|";
      }
      const walk = []; for (let i = 0; i < n; i++) if (kind[i] === 2) walk.push(i);
      for (let h = 0; h < walk.length; h++) {
        const i = walk[h], x = i % cols, y = (i / cols) | 0, d = deep[i] + 1; if (d > DEPTH) continue;
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const X = x + dx, Y = y + dy, j = Y * cols + X;
          if (X < 0 || Y < 0 || X >= cols || Y >= rows || lab[j] !== 2 || kind[j]) continue;
          kind[j] = 3; deep[j] = d; line[j] = FILL[Math.min(FILL.length - 1, d - 1)]; walk.push(j);
        }
      }
      const pick = (c) => (Math.random() < HEAVY ? SPARK[(Math.random() * SPARK.length) | 0] : c);
      const ch = line.map((c, i) => (c && kind[i] !== 3 ? pick(c) : c)), t0 = performance.now();
      g.font = `${CELL}px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`; g.textBaseline = "top";
      const frame = (now) => {
        const tt = (now - t0) / 1000; g.clearRect(0, 0, W, H);
        for (let i = 0; i < n; i++) {
          const k = kind[i]; if (!k) continue;
          const x = i % cols, y = (i / cols) | 0;
          if (!still && k !== 3 && Math.random() < 0.006) ch[i] = pick(line[i]);
          const wave = still ? 1 : 0.6 + 0.4 * Math.sin(tt * 0.6 - x * 0.12 + y * 0.07);
          g.globalAlpha = DIM * wave * (k === 3 ? 0.85 * (1 - deep[i] / (DEPTH + 1)) : 1) * (k === 1 ? 1 : LEAF);
          g.fillStyle = k === 1 ? "#efefef" : "#d8d8d8";
          g.fillText(ch[i], x * CELL, y * CELL);
        }
        if (!still) requestAnimationFrame(frame);
      };
      requestAnimationFrame(frame);
    };
    mask.src = FLOWERS;
  })();
</script>
