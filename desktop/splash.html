<!doctype html>
<!-- The window while the app gets going: an update if there is one (Windows, Linux), then the engine starting. -->
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; font-src 'self'; script-src 'unsafe-inline'">
<title>Pitchroom</title>
<style>
  @font-face { font-family: "Geist Serif"; src: url("GeistSerif-Regular.woff2") format("woff2"); }
  html, body { margin: 0; height: 100%; background: #0e0e0e; color: oklch(0.94 0 0); cursor: default; user-select: none; -webkit-app-region: drag; }
  body { position: relative; font: 12px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .name { position: absolute; inset: 0 0 24px; display: grid; place-items: center; font: 400 28px "Geist Serif", Georgia, serif; letter-spacing: -0.01em; }
  .foot { position: absolute; left: 0; right: 0; bottom: 22px; display: flex; flex-direction: column; align-items: center; }
  .bar { position: relative; width: 168px; height: 2px; border-radius: 1px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
  .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: oklch(0.87 0 0); transition: width 0.2s; }
  .bar.busy .fill { width: 32%; transition: none; animation: slide 1.3s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(320%); } }
  .status { margin-top: 10px; height: 1.4em; color: rgba(255, 255, 255, 0.55); font-variant-numeric: tabular-nums; }
  @media (prefers-reduced-motion: reduce) { .bar.busy .fill { animation: none; width: 100%; opacity: 0.4; } }
</style>
</head>
<body>
  <div class="name">Pitchroom</div>
  <div class="foot">
    <div class="bar busy" id="bar"><div class="fill" id="fill"></div></div>
    <div class="status" id="status">Starting…</div>
  </div>
<script>
  // main.js: set({ text, percent }); no percent, the bar just moves
  function set({ text, percent }) {
    document.getElementById("status").textContent = text;
    const bar = document.getElementById("bar"), fill = document.getElementById("fill");
    bar.classList.toggle("busy", percent == null);
    fill.style.width = percent == null ? "" : `${percent}%`;
  }
</script>
</body>
</html>
