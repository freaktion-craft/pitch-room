  .mid { position: absolute; inset: 0; justify-content: center; display: flex; flex-direction: column; align-items: center; }
  .bar { position: relative; width: 168px; height: 2px; border-radius: 1px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
  .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: oklch(0.87 0 0); transition: width 0.2s; }
  .bar.busy .fill { width: 32%; transition: none; animation: slide 1.3s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(320%); } }
  @media (prefers-reduced-motion: reduce) { .bar.busy .fill { animation: none; width: 100%; opacity: 0.4; } }
  /* the light theme (main.js: ?theme=light): the still turned over, light with its colours kept; the bar in the light ink */
  html.light, html.light body { background: #f3f3f3; color: oklch(0.2 0 0); }
  html.light .scene { filter: invert(1) hue-rotate(180deg); }
  html.light .bar { background: rgba(0, 0, 0, 0.12); }
  html.light .fill { background: oklch(0.32 0 0); }
</style>
<script>if (new URLSearchParams(location.search).get("theme") === "light") document.documentElement.classList.add("light");</script>
</head>
<body>
  <div class="scene"></div>
  <div class="mid">
    <div class="bar busy" id="bar"><div class="fill" id="fill"></div></div>
  </div>
<script>
  // main.js: set({ text, percent }); no percent, the bar just moves
  function set({ text, percent }) {
    document.title = text; // no line on show: the bar alone
    const bar = document.getElementById("bar"), fill = document.getElementById("fill");
    bar.classList.toggle("busy", percent == null);
    fill.style.width = percent == null ? "" : `${percent}%`;
  }

</script>
</body>
