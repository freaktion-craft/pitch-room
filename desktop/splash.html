<!doctype html>
<!-- The window while the app gets going: an update if there is one (Windows), then the engine starting. -->
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Pitchroom</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e0e0e; color: oklch(0.94 0 0); cursor: default; user-select: none; -webkit-app-region: drag; }
  body { position: relative; font: 12px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .mid { position: absolute; inset: 0; justify-content: center; display: flex; flex-direction: column; align-items: center; }
  .bar { position: relative; width: 168px; height: 2px; border-radius: 1px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
  .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: oklch(0.87 0 0); transition: width 0.2s; }
  /* starting: a piece of it going left and right, end to end; an update coming in: the bar filling as it does */
  .bar.busy .fill { width: 32%; transition: none; animation: swing 0.9s ease-in-out infinite alternate; }
  @keyframes swing { from { left: 0; } to { left: 68%; } }
  /* what's going on, in a line under the bar (main.js: status), the bar kept in the middle */
  .line { position: absolute; left: 0; right: 0; top: calc(50% + 13px); text-align: center; font-size: 12px; line-height: 16px;
    color: rgba(255, 255, 255, 0.5); font-variant-numeric: tabular-nums; white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { .bar.busy .fill { animation: none; width: 100%; opacity: 0.4; } }
  /* the light theme (main.js: ?theme=light): the bar in the light ink */
  html.light, html.light body { background: #f3f3f3; color: oklch(0.2 0 0); }
  html.light .bar { background: rgba(0, 0, 0, 0.12); }
  html.light .fill { background: oklch(0.32 0 0); }
  html.light .line { color: rgba(0, 0, 0, 0.5); }
</style>
<script>if (new URLSearchParams(location.search).get("theme") === "light") document.documentElement.classList.add("light");</script>
</head>
<body>
  <div class="mid">
    <div class="bar busy" id="bar"><div class="fill" id="fill"></div></div>
  </div>
  <div class="line" id="line"></div>
<script>
  // main.js: set({ text, percent }); no percent, the bar swings
  function set({ text, percent }) {
    document.title = text;
    document.getElementById("line").textContent = text;
    const bar = document.getElementById("bar"), fill = document.getElementById("fill");
    bar.classList.toggle("busy", percent == null);
    fill.style.width = percent == null ? "" : `${percent}%`;
    const swing = percent == null && fill.getAnimations()[0];
    if (swing) swing.startTime = performance.now() - (Date.now() % 1800); // in step with the clock, as its double is (update-splash.ps1) and the next one's
    // splash: one over the other, the bar doesn't jump
  }

</script>
</body>
</html>
